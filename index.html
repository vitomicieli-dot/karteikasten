/* ==========================================================================
   7. Import / Export
   ========================================================================== */
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='karteikasten-sicherung-'+dayKey(new Date())+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast('Sicherung gespeichert.');
}

function doImportFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{ importData(JSON.parse(rd.result)); }
      catch(e){ toast('Datei konnte nicht gelesen werden: '+e.message,5000); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* Akzeptiert drei Formen:
   1. eine vollständige Sicherung dieser App
   2. { deck:{…}, cards:[…] }        — ein Stapel
   3. { decks:[ {deck, cards}, … ] } — mehrere Stapel auf einmal          */
function importData(data){
  if(!data||typeof data!=='object') throw new Error('unbekanntes Format');

  if(data.v&&Array.isArray(data.decks)&&Array.isArray(data.cards)){
    modal={type:'confirm',title:'Sicherung einspielen?',
      text:'Das ersetzt deinen jetzigen Stand vollständig: '+data.cards.length+' Karten in '+
           data.decks.length+' Stapeln, samt Lernfortschritt.',
      ok:'Ja, ersetzen', fn:()=>{
        S=data;
        /* Fehlende Felder ergänzen — eine alte oder von Hand gebaute Sicherung
           kann Einstellungen weglassen, sonst rechnet die App mit undefined. */
        S.settings=Object.assign({},DEFAULT_SETTINGS,S.settings||{});
        S.log=S.log||[]; S.cards=S.cards||[]; S.decks=S.decks||[];
        save(); view='home'; toast('Sicherung eingespielt.'); }};
    render(); return;
  }

  const packs = Array.isArray(data.decks) ? data.decks
              : (data.deck||data.cards) ? [data] : null;
  if(!packs) throw new Error('weder Sicherung noch Kartenstapel');

  /* Standardmäßig werden Dubletten übersprungen — das schützt den Lernstand.
     Trägt die Datei "aktualisieren": true, werden Rückseite, Notiz,
     Schlagwörter und Quelle bestehender Karten ersetzt. Der Lernstand (Termin,
     Stabilität, Schwierigkeit, Rückfälle) bleibt dabei unangetastet. */
  const modusAktualisieren = data.aktualisieren===true;
  let added=0, skipped=0, newDecks=0, updated=0;
  for(const p of packs){
    const meta=p.deck||{name:'Importiert',examDate:'',color:DECK_COLORS[0]};
    let deck=S.decks.find(d=>d.name.trim().toLowerCase()===String(meta.name||'').trim().toLowerCase());
    if(!deck){
      deck={id:uid(),name:meta.name||'Importiert',examDate:meta.examDate||'',
            color:meta.color||DECK_COLORS[S.decks.length%DECK_COLORS.length],created:Date.now()};
      S.decks.push(deck); newDecks++;
    }else if(meta.examDate&&!deck.examDate){ deck.examDate=meta.examDate; }

    const vorhanden=new Map();
    for(const c of S.cards) if(c.deckId===deck.id)
      vorhanden.set(String(c.front).trim().toLowerCase(),c);
    for(const raw of (p.cards||[])){
      const front=String(raw.front||'').trim();
      if(!front||!String(raw.back||'').trim()){ skipped++; continue; }
      const alt=vorhanden.get(front.toLowerCase());
      if(alt){
        if(!modusAktualisieren){ skipped++; continue; }
        alt.back=String(raw.back).trim();
        alt.note=raw.note?String(raw.note).trim():'';
        if(Array.isArray(raw.tags)) alt.tags=raw.tags;
        if(raw.source) alt.source=raw.source;
        if(raw.type) alt.type=raw.type==='concept'?'concept':'basic';
        updated++; continue;
      }
      S.cards.push(Object.assign({
        id:uid(),deckId:deck.id,
        type:raw.type==='concept'?'concept':'basic',
        front:front, back:String(raw.back).trim(),
        note:raw.note?String(raw.note).trim():'',
        tags:Array.isArray(raw.tags)?raw.tags:[],
        source:raw.source||'', created:Date.now()
      },newCardState()));
      added++;
      vorhanden.set(front.toLowerCase(),S.cards[S.cards.length-1]);
    }
  }
  save(); view='home'; render();
  toast(added+' Karten übernommen'+(updated?' · '+updated+' aktualisiert':'')+
        (newDecks?', '+newDecks+' Stapel neu angelegt':'')+
        (skipped?' · '+skipped+' übersprungen (Dublette oder unvollständig)':''),5000);
}

/* ==========================================================================
   8. Ereignisse
   ========================================================================== */
function closeModal(){ modal=null; render(); }

function bind(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=()=>{ view=el.dataset.nav; session=null; render(); };
  });

  const q=document.getElementById('f-q');
  if(q){
    q.oninput=()=>{ browseFilter.q=q.value; const p=q.selectionStart; render();
      const n=document.getElementById('f-q'); if(n){n.focus();n.setSelectionRange(p,p);} };
  }
  const fd=document.getElementById('f-deck');
  if(fd) fd.onchange=()=>{ browseFilter.deck=fd.value; render(); };
  const fs=document.getElementById('f-state');
  if(fs) fs.onchange=()=>{ browseFilter.state=fs.value; render(); };

  const ret=document.getElementById('s-ret');
  if(ret){
    ret.oninput=()=>{
      document.getElementById('s-ret-lbl').textContent=Math.round(ret.value*100)+
        ' % — je höher, desto häufiger die Wiederholungen und desto mehr Arbeit pro Tag.';
    };
    ret.onchange=()=>{ S.settings.desiredRetention=parseFloat(ret.value); save(); toast('Gespeichert.'); };
  }
  const sn=document.getElementById('s-new');
  if(sn) sn.onchange=()=>{ S.settings.newPerDay=Math.max(0,parseInt(sn.value)||0); save(); toast('Gespeichert.'); };
  const sm=document.getElementById('s-max');
  if(sm) sm.onchange=()=>{ S.settings.maximumInterval=Math.max(1,parseInt(sm.value)||1095); save(); toast('Gespeichert.'); };
  const sg=document.getElementById('s-gap');
  if(sg) sg.onchange=()=>{ S.settings.retryGap=Math.min(30,Math.max(0,parseInt(sg.value)||0)); save(); toast('Gespeichert.'); };
  const fdz=document.getElementById('s-fdays');
  if(fdz) fdz.onchange=()=>{ S.settings.focusDays=Math.min(90,Math.max(0,parseInt(fdz.value)||0)); save(); render(); };
  const fpk=document.getElementById('s-fpeak');
  if(fpk){
    fpk.oninput=()=>{ document.getElementById('s-fpeak-lbl').textContent=
      Math.round(fpk.value*100)+' % Prüfungsfach, '+Math.round((1-fpk.value)*100)+
      ' % Erhaltungsdosis für die übrigen Fächer.'; };
    fpk.onchange=()=>{ S.settings.focusPeak=parseFloat(fpk.value); save(); render(); };
  }

  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick=ev=>{
      const a=el.dataset.act;
      if(a==='modal-bg'&&ev.target!==el) return;
      ev.stopPropagation();
      handle(a,el,ev);
    };
  });
}

function handle(a,el){
  const id=el.dataset.id;
  switch(a){
    case 'learn-all': startSession(null); break;
    case 'learn-deck': startSession(id||null); break;
    case 'end-session': session=null; undoStack=[]; view='home'; render(); break;
    case 'show': if(session){ session.shown=true; render(); } break;
    case 'grade': grade(parseInt(el.dataset.g)); break;
    case 'undo': undo(); break;

    case 'new-deck': modal={type:'deck',deck:{name:'',examDate:'',color:DECK_COLORS[S.decks.length%DECK_COLORS.length]}}; render(); break;
    case 'edit-deck': { const d=deckById(id); if(d) modal={type:'deck',deck:Object.assign({},d)}; render(); break; }
    case 'pick-color': modal.deck.color=el.dataset.v; render(); break;
    case 'save-deck': {
      const name=(document.getElementById('m-name').value||'').trim();
      if(!name){ toast('Bitte einen Namen eingeben.'); return; }
      const exam=document.getElementById('m-exam').value||'';
      if(modal.deck.id){
        const d=deckById(modal.deck.id);
        d.name=name; d.examDate=exam; d.color=modal.deck.color;
      }else{
        S.decks.push({id:uid(),name:name,examDate:exam,color:modal.deck.color,created:Date.now()});
      }
      save(); closeModal(); toast('Stapel gesichert.'); break;
    }
    case 'delete-deck': {
      const d=deckById(id); const n=S.cards.filter(c=>c.deckId===id).length;
      modal={type:'confirm',title:'Stapel löschen?',
        text:'„'+(d?d.name:'')+'" und '+n+' Karten werden entfernt. Das lässt sich nicht rückgängig machen.',
        fn:()=>{ S.decks=S.decks.filter(x=>x.id!==id); S.cards=S.cards.filter(c=>c.deckId!==id); save(); toast('Stapel gelöscht.'); }};
      render(); break;
    }

    case 'new-card': {
      const dId=browseFilter.deck||(S.decks[0]&&S.decks[0].id);
      if(!dId){ toast('Lege zuerst einen Stapel an.'); return; }
      modal={type:'card',card:{deckId:dId,type:'basic',front:'',back:'',note:'',tags:[]}}; render(); break;
    }
    case 'edit-card': { const c=S.cards.find(x=>x.id===id); if(c) modal={type:'card',card:Object.assign({},c)}; render(); break; }
    case 'save-card': {
      const front=(document.getElementById('m-front').value||'').trim();
      const back=(document.getElementById('m-back').value||'').trim();
      if(!front||!back){ toast('Vorder- und Rückseite dürfen nicht leer sein.'); return; }
      const patch={
        deckId:document.getElementById('m-deck').value,
        type:document.getElementById('m-type').value,
        front:front, back:back,
        note:(document.getElementById('m-note').value||'').trim(),
        tags:(document.getElementById('m-tags').value||'').split(',').map(t=>t.trim()).filter(Boolean)
      };
      if(modal.card.id){
        const i=S.cards.findIndex(c=>c.id===modal.card.id);
        S.cards[i]=Object.assign({},S.cards[i],patch);
      }else{
        S.cards.push(Object.assign({id:uid(),created:Date.now(),source:''},patch,newCardState()));
      }
      save(); closeModal(); toast('Karte gesichert.'); break;
    }
    case 'delete-card': {
      modal={type:'confirm',title:'Karte löschen?',text:'Die Karte und ihr Lernstand werden entfernt.',
        fn:()=>{ S.cards=S.cards.filter(c=>c.id!==id);
                 if(session) session.pool=session.pool.filter(x=>x!==id);
                 save(); if(session){pickNext();} toast('Karte gelöscht.'); }};
      render(); break;
    }
    case 'reset-card': {
      const i=S.cards.findIndex(c=>c.id===id);
      if(i>=0) S.cards[i]=Object.assign({},S.cards[i],newCardState());
      save(); closeModal(); toast('Karte gilt wieder als neu.'); break;
    }

    case 'export': doExport(); break;
    case 'import': doImportFile(); break;
    case 'paste-import': modal={type:'paste'}; render(); break;
    case 'do-paste': {
      const dId=document.getElementById('p-deck').value;
      const txt=document.getElementById('p-text').value||'';
      let n=0;
      for(const line of txt.split('\n')){
        const parts=line.split('|');
        if(parts.length<2) continue;
        const f=parts[0].trim(), b=parts.slice(1).join('|').trim();
        if(!f||!b) continue;
        S.cards.push(Object.assign({id:uid(),deckId:dId,type:'basic',front:f,back:b,
          note:'',tags:[],source:'',created:Date.now()},newCardState()));
        n++;
      }
      save(); closeModal();
      toast(n?n+' Karten angelegt.':'Keine verwertbare Zeile gefunden.');
      break;
    }

    case 'theme': S.settings.theme=el.dataset.v; save(); render(); break;
    case 'listsize': S.settings.listSize=el.dataset.v; save(); render(); break;
    case 'newmode': S.settings.newMode=el.dataset.v; save(); render();
      toast(S.settings.newMode==='auto'?'Taktung rechnet jetzt selbst.':'Feste Zahl aktiv.'); break;
    case 'interleave': S.settings.interleave=el.dataset.v==='1'; save(); render();
      toast(S.settings.interleave?'Themen werden gemischt.':'Themen werden blockweise abgearbeitet.'); break;
    case 'reset':
      modal={type:'confirm',title:'Wirklich alles löschen?',
        text:'Sämtliche Stapel, Karten und dein gesamter Lernfortschritt werden entfernt. Sichere vorher, falls du zögerst.',
        ok:'Ja, alles löschen',
        fn:()=>{ S=defaultState(); save(); view='home'; toast('Alles zurückgesetzt.'); }};
      render(); break;

    case 'confirm-yes': { const fn=modal.fn; modal=null; if(fn) fn(); render(); break; }
    case 'close-modal': case 'modal-bg': closeModal(); break;
  }
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')){
    if(e.key==='Escape'&&modal){ e.target.blur(); closeModal(); }
    return;
  }
  if(modal){
    if(e.key==='Escape') closeModal();
    return;
  }
  if(view!=='review'||!session) return;
  if(e.key==='Escape'){ session=null; undoStack=[]; view='home'; render(); return; }
  if(e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(!session.current) return;
  if(!session.shown){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); session.shown=true; render(); }
    return;
  }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); grade(3); return; }
  if(['1','2','3','4'].includes(e.key)){ e.preventDefault(); grade(parseInt(e.key)); }
});

/* Offline-Betrieb auf der gehosteten Fassung; lokal geöffnet still übersprungen. */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

save();
render();
